<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="시험 대비 학습 계획을 관리하는 To-Do 리스트">
  <title>시험 대비 To-Do 리스트</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="min-w-[320px] bg-pink-50 text-slate-800">
  <main class="mx-auto min-h-screen max-w-5xl px-4 py-6 sm:px-6 sm:py-10">
    <header class="relative overflow-hidden rounded-[2rem] border border-pink-200 bg-white px-5 py-7 shadow-2xl shadow-pink-200/60 sm:px-8 sm:py-10">
      <div class="pointer-events-none absolute -right-20 -top-24 h-64 w-64 rounded-full bg-pink-200/60 blur-3xl"></div>
      <div class="relative grid gap-8 lg:grid-cols-[1.4fr_1fr] lg:items-end">
        <div>
          <p class="mb-3 text-xs font-bold uppercase tracking-[0.3em] text-pink-500">STUDY PLANNER</p>
          <h1 class="max-w-xl text-3xl font-black tracking-tight text-slate-900 sm:text-5xl">시험 대비<br class="sm:hidden"> To-Do 리스트</h1>
          <p class="mt-4 max-w-lg text-sm leading-6 text-slate-500 sm:text-base">오늘의 공부 계획을 세우고, 완료까지 한눈에 관리하세요.</p>
        </div>
        <div class="grid grid-cols-2 gap-3 text-sm lg:text-right">
          <div class="rounded-2xl border border-pink-100 bg-pink-50 p-4">
            <span class="block text-xs text-slate-500">오늘</span>
            <strong id="todayDate" class="mt-1 block text-lg text-slate-900">-</strong>
          </div>
          <div class="rounded-2xl border border-pink-100 bg-pink-50 p-4">
            <span class="block text-xs text-slate-500">다음 목표</span>
            <strong id="nextDueDate" class="mt-1 block text-lg text-pink-600">-</strong>
          </div>
        </div>
      </div>
      <section class="relative mt-8" aria-labelledby="progressHeading">
        <div class="mb-2 flex items-center justify-between">
          <h2 id="progressHeading" class="text-sm font-bold text-slate-600">학습 진행률</h2>
          <strong id="progressPercent" class="text-sm text-pink-600">0%</strong>
        </div>
        <div id="progressTrack" class="h-3 overflow-hidden rounded-full bg-pink-100" role="progressbar" aria-label="학습 진행률" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">
          <div id="progressBar" class="h-full rounded-full bg-gradient-to-r from-pink-400 to-rose-500 transition-all duration-300" style="width: 0%"></div>
        </div>
      </section>
    </header>

    <section class="mt-6 rounded-[1.5rem] border border-slate-200 bg-white p-5 text-slate-900 shadow-xl shadow-slate-950/10 sm:p-7" aria-labelledby="addHeading">
      <div class="mb-6 flex items-start gap-3">
        <span class="pt-1 text-xs font-black tracking-widest text-cyan-600">01</span>
        <div>
          <h2 id="addHeading" class="text-xl font-black">새 계획 추가</h2>
          <p class="mt-1 text-sm text-slate-500">시험 전까지 해야 할 일을 기록하세요.</p>
        </div>
      </div>
      <form id="taskForm" novalidate>
        <div class="grid gap-4 lg:grid-cols-6">
          <div class="lg:col-span-3">
            <label for="taskText" class="mb-2 block text-sm font-bold text-slate-700">할 일 내용</label>
            <input id="taskText" class="w-full rounded-xl border border-slate-300 px-4 py-3 text-sm outline-none transition placeholder:text-slate-400 focus:border-cyan-500 focus:ring-4 focus:ring-cyan-100" type="text" maxlength="500" placeholder="예: 수학 3단원 개념 정리" required>
          </div>
          <div class="lg:col-span-2">
            <label for="taskDueDate" class="mb-2 block text-sm font-bold text-slate-700">목표 날짜</label>
            <input id="taskDueDate" class="w-full rounded-xl border border-slate-300 px-4 py-3 text-sm outline-none transition focus:border-cyan-500 focus:ring-4 focus:ring-cyan-100" type="date" required>
          </div>
          <div class="lg:col-span-1">
            <label for="taskPriority" class="mb-2 block text-sm font-bold text-slate-700">중요도</label>
            <select id="taskPriority" class="w-full rounded-xl border border-slate-300 bg-white px-3 py-3 text-sm outline-none transition focus:border-cyan-500 focus:ring-4 focus:ring-cyan-100" required>
              <option value="high">상</option>
              <option value="medium" selected>중</option>
              <option value="low">하</option>
            </select>
          </div>
          <div class="flex justify-end lg:col-span-6">
            <button class="w-full rounded-xl bg-slate-900 px-5 py-3 text-sm font-bold text-white transition hover:bg-cyan-700 focus:outline-none focus:ring-4 focus:ring-cyan-200 sm:w-auto" type="submit">계획 추가</button>
          </div>
        </div>
        <div id="formMessage" class="mt-3 min-h-5 text-sm text-red-600" role="alert" aria-live="polite"></div>
      </form>
    </section>

    <section class="mt-8" aria-labelledby="listHeading">
      <div class="mb-4 flex flex-col gap-4 sm:flex-row sm:items-end sm:justify-between">
        <div class="flex items-start gap-3">
          <span class="pt-1 text-xs font-black tracking-widest text-pink-500">02</span>
          <div>
            <h2 id="listHeading" class="text-xl font-black text-slate-900">학습 계획</h2>
            <p id="taskCount" class="mt-1 text-sm text-slate-500">0개의 계획</p>
          </div>
        </div>
        <div class="grid grid-cols-3 rounded-xl border border-pink-200 bg-white p-1 shadow-sm" role="group" aria-label="할 일 필터">
          <button type="button" class="rounded-lg bg-pink-500 px-4 py-2 text-sm font-bold text-white transition" data-filter="all" aria-pressed="true">전체</button>
          <button type="button" class="rounded-lg px-4 py-2 text-sm font-bold text-slate-500 transition hover:text-pink-600" data-filter="active" aria-pressed="false">진행 중</button>
          <button type="button" class="rounded-lg px-4 py-2 text-sm font-bold text-slate-500 transition hover:text-pink-600" data-filter="completed" aria-pressed="false">완료</button>
        </div>
      </div>
      <div id="taskList" class="grid gap-3" aria-live="polite"></div>
    </section>
  </main>
  <dialog id="deleteDialog" class="w-[min(90vw,28rem)] rounded-3xl border-0 bg-white p-0 text-slate-800 shadow-2xl backdrop:bg-slate-900/40">
    <div class="p-6 sm:p-7">
      <p class="text-xs font-bold uppercase tracking-[0.2em] text-pink-500">DELETE PLAN</p>
      <h2 class="mt-2 text-xl font-black">이 계획을 삭제할까요?</h2>
      <p id="deleteTargetText" class="mt-3 break-anywhere rounded-xl bg-pink-50 p-3 text-sm text-slate-600"></p>
      <div class="mt-6 flex justify-end gap-2">
        <button id="cancelDelete" class="rounded-xl border border-slate-200 px-4 py-2 text-sm font-bold text-slate-600 transition hover:bg-slate-50" type="button">취소</button>
        <button id="confirmDelete" class="rounded-xl bg-pink-500 px-4 py-2 text-sm font-bold text-white transition hover:bg-pink-600" type="button">삭제하기</button>
      </div>
    </div>
  </dialog>
  <div id="celebrationRibbon" class="pointer-events-none fixed inset-0 z-50 hidden overflow-hidden" aria-live="polite" aria-label="완료 축하 효과"></div>
  <script src="script.js"></script>
</body>
</html>
