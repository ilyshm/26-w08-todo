<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="시험 대비 학습 계획을 관리하는 To-Do 리스트">
  <title>시험 대비 To-Do 리스트</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container py-4 py-md-5">
    <header class="app-header mb-4">
      <div class="row align-items-end g-3">
        <div class="col-lg-7">
          <p class="eyebrow mb-2">STUDY PLANNER</p>
          <h1 class="display-6 fw-bold mb-2">시험 대비 To-Do 리스트</h1>
          <p class="text-secondary mb-0">오늘의 공부 계획을 세우고, 완료까지 한눈에 관리하세요.</p>
        </div>
        <div class="col-lg-5">
          <div class="date-summary text-lg-end">
            <span class="text-secondary">오늘</span>
            <strong id="todayDate">-</strong>
            <span class="text-secondary">목표 날짜</span>
            <strong id="nextDueDate">-</strong>
          </div>
        </div>
      </div>

      <section class="progress-panel mt-4" aria-labelledby="progressHeading">
        <div class="d-flex justify-content-between align-items-center mb-2">
          <h2 id="progressHeading" class="h6 mb-0">학습 진행률</h2>
          <strong id="progressPercent">0%</strong>
        </div>
        <div class="progress" role="progressbar" aria-label="학습 진행률" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">
          <div id="progressBar" class="progress-bar" style="width: 0%"></div>
        </div>
      </section>
    </header>

    <section class="surface-panel p-3 p-md-4 mb-4" aria-labelledby="addHeading">
      <div class="section-heading mb-3">
        <span class="section-number">01</span>
        <div>
          <h2 id="addHeading" class="h4 mb-1">새 계획 추가</h2>
          <p class="text-secondary mb-0">시험 전까지 해야 할 일을 기록하세요.</p>
        </div>
      </div>
      <form id="taskForm" novalidate>
        <div class="row g-3">
          <div class="col-12 col-lg-6">
            <label for="taskText" class="form-label">할 일 내용</label>
            <input id="taskText" class="form-control" type="text" maxlength="500" placeholder="예: 수학 3단원 개념 정리" required>
            <div id="taskTextError" class="invalid-feedback">할 일 내용을 입력해 주세요.</div>
          </div>
          <div class="col-6 col-lg-3">
            <label for="taskDueDate" class="form-label">목표 날짜</label>
            <input id="taskDueDate" class="form-control" type="date" required>
            <div id="taskDueDateError" class="invalid-feedback">목표 날짜를 선택해 주세요.</div>
          </div>
          <div class="col-6 col-lg-3">
            <label for="taskPriority" class="form-label">중요도</label>
            <select id="taskPriority" class="form-select" required>
              <option value="high">상</option>
              <option value="medium" selected>중</option>
              <option value="low">하</option>
            </select>
          </div>
          <div class="col-12 d-flex justify-content-end">
            <button class="btn btn-primary px-4" type="submit">계획 추가</button>
          </div>
        </div>
        <div id="formMessage" class="form-message mt-3" role="alert" aria-live="polite"></div>
      </form>
    </section>

    <section aria-labelledby="listHeading">
      <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-3">
        <div class="section-heading">
          <span class="section-number">02</span>
          <div>
            <h2 id="listHeading" class="h4 mb-1">학습 계획</h2>
            <p id="taskCount" class="text-secondary mb-0">0개의 계획</p>
          </div>
        </div>
        <div class="btn-group filter-group" role="group" aria-label="할 일 필터">
          <button type="button" class="btn btn-outline-secondary active" data-filter="all" aria-pressed="true">전체</button>
          <button type="button" class="btn btn-outline-secondary" data-filter="active" aria-pressed="false">진행 중</button>
          <button type="button" class="btn btn-outline-secondary" data-filter="completed" aria-pressed="false">완료</button>
        </div>
      </div>
      <div id="taskList" class="task-list" aria-live="polite"></div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
